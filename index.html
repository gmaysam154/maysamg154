<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة عمل تفاعلية: التثقيف المروري</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .question-text {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin: 8px 0;
            padding: 10px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .options label:hover {
            background: #eef7ff;
        }
        .options input {
            margin-left: 10px;
        }
        #submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
        }
        #submit-btn:hover {
            background-color: #219150;
        }
        #result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #e8f4fd;
            border-radius: 10px;
            text-align: center;
        }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
        .feedback { font-weight: bold; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>ورقة عمل: قوانين السير والقيادة الآمنة</h1>
    <p style="text-align: center;">اختر الإجابة الصحيحة لكل سؤال ثم اضغط على "عرض النتيجة" في الأسفل.</p>
    
    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" id="submit-btn" onclick="calculateScore()">عرض النتيجة النهائية</button>
    </form>

    <div id="result">
        <h2>نتيجتك هي: <span id="scoreText"></span> من 30</h2>
        <p id="percentageText"></p>
        <button onclick="location.reload()" style="padding: 10px 20px; cursor: pointer;">إعادة المحاولة</button>
    </div>
</div>

<script>
    const questions = [
        { q: "على مَن يُفرض واجب معرفة قوانين السير والانصياع لها؟", a: ["فقط على سائقي مركبة مع محرك", "على كل شخص يستعمل الطريق وبحوزته رخصة قيادة", "على كل شخص يستعمل الطريق", "فقط على من يقود المركبة وعلى المسافرين فيها"], correct: 2 },
        { q: "من يحق له قيادة مركبة مع محرك؟", a: ["كل من يفي بالشروط التي تم تحديدها في الامتحان السنوي للمركبة", "كل من يفي بالشروط المسجلة في توجيهات منتج المركبة", "كل من بحوزته رخصة قيادة سارية المفعول لنفس نوع المركبة", "كل من لم تتم إدانته بمخالفة سير في السنتين الأخيرتين"], correct: 2 },
        { q: "في أية حالة يُمنع السائق من قيادة مركبة من أي نوع؟", a: ["عندما يمكن لحالته الجسدية أو النفسية أن تشكل خطراً على عابري الطريق الآخرين", "قبل تناول دواء وخلال 24 ساعة متواصلة بعد ذلك", "القانون لم يحدّد حالة يُمنع فيها من القيادة لمن لديه رخصة سارية", "إذا لم يسترح السائق ثماني ساعات على الأقل قبل بدء القيادة"], correct: 0 },
        { q: "ما هي درجة رخصة القيادة اللازمة لقيادة مركبة وزنها الكلي حتى 3,500 كغم؟", a: ["A1", "B", "A", "1"], correct: 1 },
        { q: "هل يجب التأشير بالغماز أثناء الحيدان يمينا أو يساراً عن مسلك السفر؟", a: ["لا يجب إذا كان الحيدان كبيراً ورآه جميع السائقين", "لا يجب أثناء الحيدان من مسلك إلى آخر", "يجب فقط عند الانتقال من مسلك إلى آخر", "يجب التأشير بالغماز قبل كل حيدان عن مسلك السفر حتى إكماله"], correct: 3 },
        { q: "ما هو تعريف 'مبدل الطرق' (Interchange)؟", a: ["ملتقى شارعين أو أكثر في نفس المستوى", "ملتقى شارعين في طريق داخل المدينة فقط", "منطقة ملتقى ثلاثة شوارع في نفس المستوى", "ملتقى طرق في مستويات مختلفة، يمكن فيه الانتقال من طريق إلى أخرى"], correct: 3 },
        { q: "كيف يجب التصرف عند الخروج من ساحة أو طريق بيت للوصول إلى الرصيف؟", a: ["إعطاء الأولوية للمشاة القادمين من اليمين فقط", "اتباع نفس قواعد حق الأولوية المتبعة في مفارق الطرق", "القيادة حسب قاعدة 'من يصل أولاً يخرج أولاً'", "الإبطاء والتوقف إذا استدعت الحاجة للسماح للمشاة بالمرور بأمان"], correct: 3 },
        { q: "ما هي 'منطقة حركة سير معتدلة'؟", a: ["منطقة مخصصة فقط لسير المركبات البطيئة", "منطقة تكون فيها السرعة القصوى المسموحة هي 30 كم/الساعة", "منطقة تكون فيها السرعة القصوى المسموحة هي 25 كم/الساعة", "منطقة تكون فيها السرعة القصوى المسموحة هي 40 كم/الساعة"], correct: 1 },
        { q: "ما هو ترتيب الأعمال الصحيح عند الرغبة في الإبطاء؟", a: ["النظر في المرايا، ترك دوسة البنزين، والإبطاء بواسطة الفرامل والغيارات", "توجيه الرأس للخلف، الدوس على الفرامل، ثم النظر في المرايا", "الإشارة باليد للسائق الخلفي، النظر في المرايا، ثم الضغط على الفرامل", "النظر في المرايا، الضغط بقوة على الفرامل، وتشغيل الغمازات"], correct: 0 },
        { q: "ما هي فائدة القيادة في الجانب الأيمن من الشارع؟", a: ["تساعد على الحفاظ على مسافة آمنة من المركبات في المسلك المعاكس", "تمكن من تقليص مسافة رد الفعل في حالات الخطر", "لا توجد أي أفضلية للقيادة في اليمين", "تمكن من البقاء داخل المجال المسموح به للسرعة"], correct: 0 },
        { q: "ما هو الخطر في القيادة المتواصلة لساعات طويلة؟", a: ["تسخن بطانة الفرامل وتتلف سريعاً", "تعب السائق وميله إلى النوم", "لا يوجد خطر طالما أن السائق معافى والمركبة سليمة", "قوة المحرك تقل وتقل معها قدرة المركبة على زيادة السرعة"], correct: 1 },
        { q: "كيف يمكن تجنب التعب أثناء القيادة؟", a: ["بواسطة التوقف للاستراحة والانتعاش", "بواسطة زيادة السرعة لتقصير زمن السفر", "بواسطة شرب قهوة سوداء، فهي تحل جميع مشاكل التعب", "بواسطة تناول وجبة دسمة واختيار مسلك سفر بديل"], correct: 0 },
        { q: "كيف يؤثر الحفاظ على مسافة أمان على طابع القيادة؟", a: ["لا يوجد للحفاظ على مسافة تأثير على طابع القيادة", "يرهق السائق لأنه يلزمه بملاءمة مسافته باستمرار", "يساهم في القيادة الهادئة ويقلص الضغط النفسي والتعب لدى السائق", "يجعل السائق يغير سرعته مرات عديدة وبشكل عصبي"], correct: 2 },
        { q: "هل يُسمح للسائق بكتابة رسالة نصية (SMS) أثناء القيادة؟", a: ["ممنوعة وخطرة أثناء القيادة", "مسموح فقط إذا كانت الرسالة قصيرة جداً", "مسموح فقط في الطرق غير المزدحمة", "مسموح فقط للسائقين ذوي الخبرة"], correct: 0 },
        { q: "كيف يؤثر تشتت الانتباه على إيقاف المركبة؟", a: ["يعيق رد فعل السائق ويؤدي إلى إبعاد نقطة التوقف النهائية للمركبة", "يسرع رد فعل السائق ويقلل مسافة التوقف", "يعيق رد فعله لكنه لا يؤثر على مسافة التوقف", "لا يؤثر على سرعة رد الفعل بل على صواب القرارات فقط"], correct: 0 },
        { q: "هل يجوز للشرطي أن يطلب من السائق الخضوع لفحص نَفَس للكشف عن الكحول؟", a: ["لا، ليس من حقه طلب ذلك باستثناء فحص النفخ", "لا، إلا بأمر من المحكمة", "نعم، يجوز للشرطي أن يطلب ذلك في أي وقت", "نعم، لكن فقط إذا رأى السائق ينحرف عن مسلكه"], correct: 2 },
        { q: "ما هو 'فحص النفخ'؟", a: ["فحص ينفخ فيه السائق داخل جهاز يقيس مستوى الكحول في دمه", "فحص يقيس كمية الهواء التي تدخل رئتي السائق", "فحص طبي يُجرى لدى طبيب العائلة", "فحص يقيس حجم رئتي السائق"], correct: 0 },
        { q: "كيف يؤثر شرب الكحول على القدرة على رد الفعل؟", a: ["نعم، يؤثر سلباً لأن الكحول مادة مثبطة تضعف القدرة على رد الفعل", "يؤثر بشكل جيد على المزاج وبالتالي يحسن القدرة على القيادة", "يؤدي إلى شعور السائق بأنه لا يستطيع القيادة بتاتاً فيمتنع عنها", "لا يؤثر الكحول على زمن رد الفعل بل على الرؤية فقط"], correct: 0 },
        { q: "هل يؤثر شرب الكحول على تقدير المسافات والسرعات؟", a: ["نعم، في جميع الأحوال", "نعم، لكن لدى الذين يضعون نظارات فقط", "نعم، لكن لدى السائقين الجدد فقط", "لا يؤثر"], correct: 0 },
        { q: "هل يؤدي شرب الكحول إلى النعاس؟", a: ["نعم", "نعم، لكن في القيادة بسرعة منخفضة فقط", "نعم، لكن في الليل فقط", "لا"], correct: 0 },
        { q: "هل يشوش شرب الكحول التنسيق بين أعضاء الجسم؟", a: ["نعم", "نعم، لكن لدى السائقين الشباب فقط", "نعم، لكن لدى كبار السن فقط", "لا"], correct: 0 },
        { q: "أي من الجمل التالية صحيحة بخصوص 'السائق المناوب' في سهرة؟", a: ["عليه الانتظار نصف ساعة بعد شرب علبة بيرة واحدة ثم يمكنه القيادة", "عليه إخبار أصدقائه بأنه شرب، وبالتالي عليهم العودة بوسيلة أخرى", "بما أنه سائق جيد، بيرة واحدة لن تؤثر عليه ويمكنه القيادة", "كمية قليلة من الكحول تجعل الحواس حادة أكثر، لذا يمكنه القيادة"], correct: 1 },
        { q: "هل يؤثر الكحول على قدرة حكم السائق على الأمور؟", a: ["نعم، يشوش قدرة حكم السائق على الأمور", "لا يوجد تأثير لشرب الكحول على قدرة الحكم", "يمكن أن يشوش القدرة فقط لدى المرضى", "يشوش قدرة الحكم فقط عند القيادة في ظروف جوية صعبة"], correct: 0 },
        { q: "كيف يجب القيادة عند الدخول إلى منعطف (لفّة)؟", a: ["يجب زيادة السرعة لضمان سفر سلس", "يجب إبطاء سرعة السفر", "يجب زيادة السرعة عند الدخول والإبطاء أثناء السفر فيه", "يجب السفر في مركز الشارع لضمان ثبات المركبة"], correct: 1 },
        { q: "أثناء السفر في منحدر (نزول)، كيف تقلل خطر فقدان قوة الفرامل؟", a: ["باستخدام الفرامل فقط دون استخدام قوة المحرك", "بالامتناع عن تبديل الغيارات طوال المنحدر", "بالبقاء على غيار عالٍ لتقليل استعمال الفرامل", "بالتبديل لغيار واطئ والتقليل من استعمال الفرامل"], correct: 3 },
        { q: "ما هي نتيجة 'إقفال العجلات'؟", a: ["فقدان القدرة على توجيه المركبة", "تسخن زائد لمحرك المركبة", "انطفاء المحرك في المركبات الأوتوماتيكية", "الإضرار بمنظومة الفرامل فقط"], correct: 0 },
        { q: "ما هي وظيفة جهاز (ABS)؟", a: ["تمكين فرملة أكثر قوة في الشارع الجاف", "ضمان تآكل متجانس للإطارات", "تمكين توجيه المركبة والمناورة أثناء فرملة الطوارئ", "تمكين فرملة أكثر هدوءاً في الشارع الرطب"], correct: 2 },
        { q: "ما وظيفة جهاز التحكم الإلكتروني بالثبات (ESP)؟", a: ["الحفاظ على توازن المركبة عند وجود خطر انزلاق", "منع إقفال العجلات", "التحكم في استهلاك الوقود في المحرك", "تقليص كمية الغازات الملوثة المنبعثة"], correct: 0 },
        { q: "هل يجب وضع أحزمة الأمان في مركبة مجهزة بوسائد هوائية؟", a: ["نعم، يجب وضع الأحزمة في كل مركبة بها أحزمة أمان", "نعم، لكن فقط في حال وجود عطل في الوسائد الهوائية", "لا، يمنع وضع الحزام عند وجود وسائد هوائية", "لا حاجة لوضع الحزام في المركبات المزودة بوسائد هوائية"], correct: 0 },
        { q: "كيف يجب القيادة عند لقاء مركبتين وجهاً لوجه في طريق ضيق؟", a: ["على السائقين الإبطاء وإزاحة مركبتيهما لأقصى اليمين لتجنب التصادم", "يجب على السائق الأصغر سناً التوقف وإفساح المجال", "المركبة الأكبر حجماً هي التي تمر أولاً دائماً", "يجب على السائقين زيادة السرعة للمرور بسرعة من المنطقة الضيقة"], correct: 0 }
    ];

    const container = document.getElementById('questionsContainer');

    questions.forEach((item, index) => {
        let questionHtml = `
            <div class="question-block" id="q-block-${index}">
                <div class="question-text">${index + 1}. ${item.q}</div>
                <div class="options">
                    ${item.a.map((opt, i) => `
                        <label id="label-${index}-${i}">
                            <input type="radio" name="q${index}" value="${i}"> ${opt}
                        </label>
                    `).join('')}
                </div>
                <div class="feedback" id="feedback-${index}">الإجابة الصحيحة: ${item.a[item.correct]}</div>
            </div>
        `;
        container.innerHTML += questionHtml;
    });

    function calculateScore() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const feedback = document.getElementById(`feedback-${index}`);
            feedback.style.display = 'block';

            if (selected) {
                const selectedValue = parseInt(selected.value);
                if (selectedValue === item.correct) {
                    score++;
                    document.getElementById(`label-${index}-${selectedValue}`).classList.add('correct');
                } else {
                    document.getElementById(`label-${index}-${selectedValue}`).classList.add('wrong');
                    document.getElementById(`label-${index}-${item.correct}`).classList.add('correct');
                }
            } else {
                document.getElementById(`label-${index}-${item.correct}`).classList.add('correct');
            }
        });

        document.getElementById('quizForm').style.display = 'none';
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        document.getElementById('scoreText').innerText = score;
        document.getElementById('percentageText').innerText = `نسبة النجاح: ${Math.round((score/30)*100)}%`;
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
